name: Aggiorna catalogo e pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 23 * * *"   # ogni notte (mezzanotte ora italiana in inverno)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i cataloghi Cardmarket
        run: |
          mkdir -p /tmp/src
          for N in 1 3 6 13 18 19; do
            curl -fsSL -o /tmp/src/p$N.json  https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$N.json
            curl -fsSL -o /tmp/src/ns$N.json https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_$N.json
            curl -fsSL -o /tmp/src/pg$N.json https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_$N.json
          done
      - name: Prepara il lettore di testo (OCR)
        run: |
          mkdir -p vendor /tmp/npm && cd /tmp/npm
          npm pack tesseract.js@5 tesseract.js-core@5 >/dev/null
          tar xzf tesseract.js-5*.tgz && cp package/dist/tesseract.min.js package/dist/worker.min.js "$GITHUB_WORKSPACE/vendor/" && rm -rf package
          tar xzf tesseract.js-core-5*.tgz && cp package/tesseract-core*.js "$GITHUB_WORKSPACE/vendor/" && (cp package/tesseract-core*.wasm "$GITHUB_WORKSPACE/vendor/" 2>/dev/null || true)
          ls -la "$GITHUB_WORKSPACE/vendor"
      - name: Scarica i dati TCGdex
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          cd /tmp/tcgdex && git sparse-checkout set data data-asia
      - name: Costruisci i cataloghi
        run: |
          mkdir -p data
          python tools/build.py /tmp/src /tmp/tcgdex data
          python - <<'PY'
          import json,sys
          for g in ["Pokemon","OnePiece","DragonBallSuper","Magic","YuGiOh","Lorcana"]:
              d=json.load(open(f"data/{g}.json"))
              assert len(d["p"])>1000, g
              print(g, len(d["p"]), d["d"])
          PY
      - name: Impronte visive
        timeout-minutes: 150
        run: |
          pip install --quiet pillow numpy
          git fetch --depth 1 origin fp-cache:fp-cache 2>/dev/null && git worktree add /tmp/fpcache fp-cache || (mkdir -p /tmp/fpcache && cd /tmp/fpcache && git init -q && git checkout -q -b fp-cache)
          python tools/fingerprints.py data /tmp/fpcache
          cd /tmp/fpcache && git add -A && (git -c user.name=bot -c user.email=bot@example.com commit -qm "cache impronte" || true)
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:fp-cache
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
