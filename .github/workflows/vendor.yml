name: Copia lettore OCR (per test)
on:
  push:
    paths: [".github/workflows/vendor.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd /tmp && npm pack tesseract.js@5 tesseract.js-core@5 >/dev/null
          tar xzf tesseract.js-5*.tgz && cp package/dist/tesseract.min.js package/dist/worker.min.js $GITHUB_WORKSPACE/out/ && rm -rf package
          tar xzf tesseract.js-core-5*.tgz && cp package/tesseract-core*.js $GITHUB_WORKSPACE/out/ && (cp package/tesseract-core*.wasm $GITHUB_WORKSPACE/out/ || true)
          cd $GITHUB_WORKSPACE/out && ls -la
          git init -q && git checkout -q -b vendor-files && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm vendor
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" vendor-files
